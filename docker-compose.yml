# Self-hosting stack for a single shard. Setup and configuration:
# https://docs.freeshard.net/self_hosting/
#
# Kept in step with the compose file hosted shards run; the differences are
# deliberate: no Azure credentials, no telemetry, no mail, no image pruning,
# Sundial as the only web interface, and no rollout flags.

networks:
  portal:
    name: portal

services:

  traefik:
    image: traefik:v2.11.50
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    environment:
      - XDG_CONFIG_HOME=/core
      # Certificates are requested through an Azure DNS challenge. Fill these in
      # if your domain's DNS is hosted in Azure DNS; other providers are not
      # supported yet (#292).
      #- AZURE_CLIENT_ID=
      #- AZURE_CLIENT_SECRET=
      #- AZURE_SUBSCRIPTION_ID=
      #- AZURE_TENANT_ID=
      #- AZURE_RESOURCE_GROUP=
      #- LEGO_AZURE_BYPASS_DEPRECATION=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FREESHARD_DIR:?}/core:/core
    networks:
      - portal
    depends_on:
      shard_core:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    stop_grace_period: 30s
    environment:
      - POSTGRES_DB=shard_core
      - POSTGRES_USER=shard_core
      - POSTGRES_PASSWORD=shard_core
    volumes:
      - ${FREESHARD_DIR:?}/postgres_data:/var/lib/postgresql/data
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shard_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  shard_core:
    image: ghcr.io/freeshardbase/freeshard:0.42.0
    container_name: shard_core
    restart: always
    stop_grace_period: 120s
    volumes:
      - ${FREESHARD_DIR:?}/core:/core
      - ${FREESHARD_DIR:?}/user_data:/user_data
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /proc/pressure:/host/pressure:ro
    networks:
      - portal
    environment:
      - FREESHARD_DNS__ZONE=${DNS_ZONE:?}
      - FREESHARD_TRAEFIK__ACME_EMAIL=${EMAIL:?}
      - FREESHARD_TRAEFIK__DISABLE_SSL=${DISABLE_SSL:-false}
      - FREESHARD_PATH_ROOT_HOST=${FREESHARD_DIR:?}
      # Mail goes out through Freeshard's controller, which a self-hosted shard
      # cannot use; the owner's address is taken without a confirmation mail.
      - FREESHARD_EMAIL__ENABLED=false
      - FREESHARD_SUNDIAL__ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy

  sundial:
    image: ghcr.io/freeshardbase/sundial:0.2.0
    container_name: sundial
    restart: always
    networks:
      - portal
