name: Release
run-name: Release ${{ github.event.release.tag_name }}

on:
  release:
    types: [created]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches code version
        run: |
          expected="${{ github.event.release.tag_name }}"
          actual=$(grep '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$expected" != "$actual" ]; then
            echo "::error::Release tag ($expected) does not match pyproject.toml version ($actual). Run 'just set-version $expected' and commit first."
            exit 1
          fi

  test:
    needs: version-check
    uses: ./.github/workflows/test.yml
    with:
      full: true

  build:
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    container: ghcr.io/freeshardbase/cicd-image:1.0.3
    needs: test
    permissions:
      packages: write
    steps:
      - name: Inject enhanced GitHub environment variables
        uses: rlespinasse/github-slug-action@v5
      - uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/freeshardbase/freeshard,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/freeshardbase/freeshard:${{ github.event.release.tag_name }} \
            $(printf 'ghcr.io/freeshardbase/freeshard@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/freeshardbase/freeshard:${{ github.event.release.tag_name }}

  pages:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ github.event.release.tag_name }}
